name: '[NuGet.org] Publish Identity packages'

on:
  workflow_dispatch
  
jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for NuGet.org Trusted Publishing (OIDC)

    steps:

    # must run in every workflows
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: ./.github/actions/dotnet-setup
          
    - name: Publish packages
      uses: ./.github/actions/publish-nuget
      with:
        nuget-user: ${{ secrets.NUGET_USER }}
        projects: |
          [
            "src/Identity/Identity.csproj",
            "src/Identity.EntityFrameworkCore/Identity.EntityFrameworkCore.csproj"
          ]
        working-dir: ./src/framework